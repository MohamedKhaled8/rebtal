name: rebtal
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.3+12

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # ✅ Localization الرسمي
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.3.0 
  cloud_firestore: ^6.1.1 
  get_it: ^8.2.0
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  lottie: ^3.3.1
  flutter_svg: ^2.2.0
  firebase_auth: ^6.1.3
  flutter_bloc: ^9.1.1
  shared_preferences: ^2.5.3
  shimmer: ^3.0.0
  quickalert: ^1.1.0
  image_picker: ^1.2.2
  permission_handler: ^12.0.1
  firebase_storage: ^13.0.5
  http: ^1.5.0
  mime: ^1.0.4
  cloudinary_dart: ^0.0.11
  firebase_database: ^12.1.1
  flutter_map: ^8.2.1
  # google_maps (picker) + flutter_map (tiles) — both used; merge to one stack later if possible
  google_maps_flutter: ^2.10.0
  latlong2: ^0.9.0
  dio: ^5.5.0+1
  geolocator: ^14.0.2
  geocoding: ^3.0.0
  location: ^8.0.1
  url_launcher: ^6.3.2
  bloc: ^9.0.0
  intl: ^0.20.2
  uuid: ^4.5.1
  animate_do: ^4.2.0
  firebase_app_check: ^0.4.1
  equatable: ^2.0.7
  webview_flutter: ^4.8.0
  flutter_dotenv: ^5.2.1

  # Notifications
  firebase_messaging: ^16.0.4
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  onesignal_flutter: ^5.3.5

  # PDF & Printing
  pdf: ^3.11.1
  printing: ^5.13.4
  screenshot: ^3.0.0
  path_provider: ^2.1.5
  mailer: ^6.6.0
  dartz: ^0.10.1
  share_plus: ^12.0.1
  google_fonts: ^6.3.3
  fl_chart: ^1.1.1
  confetti: ^0.7.0
  flutter_rating_bar: ^4.0.1
  responsive_screen_master: ^2.0.2
  device_info_plus: ^11.3.3
  table_calendar: ^3.2.0
  package_info_plus: ^9.0.1
  in_app_update: ^4.2.2
  photo_view: ^0.15.0
  connectivity_plus: ^7.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/jpg/logo2.jpeg"
  min_sdk_android: 21

flutter:
  generate: true

  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/jpg/
    - assets/images/png/
    - assets/images/svg/
    - assets/images/json/
    - assets/localization/
    - .env
    - shorebird.yaml