# ===============================
# Gradle JVM settings
# ===============================
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# ===============================
# Android settings
# ===============================
android.useAndroidX=true
android.enableJetifier=true
android.ndkVersion=28.1.13356709

# ===============================
# Windows stability fixes (IMPORTANT)
# ===============================
org.gradle.daemon=false
org.gradle.parallel=false
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process

# ===============================
# Optional (safe defaults)
# ===============================
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true

# ===============================
# App secrets (DO NOT COMMIT real keys)
# ===============================
# Google Maps Android API key used via manifest placeholder ${MAPS_API_KEY}
MAPS_API_KEY=

# ===============================
# Notes
# ===============================
# MapLibre doesn't require downloads token
